<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐹 Informatik am Gymnasium Wesermünde</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐹</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#58cc02; --green-d:#46a302; --green-l:#d7ffb8;
    --blue:#1cb0f6; --blue-d:#1899d6;
    --gold:#e7a13a; --gold-d:#c9851f;
    --red:#ff4b4b; --red-d:#e63a3a;
    --purple:#ce82ff;
    --ink:#3c4858; --muted:#7a8aa0; --line:#e6ebf2; --line2:#eef2f7;
    --bg:#f7f9fc; --card:#fff;
    --radius:18px; --shadow:0 8px 26px rgba(40,60,90,.10);
    font-family:"Nunito",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:inherit;font-weight:600}
  a{color:var(--blue);text-decoration:none}
  h1,h2,h3{font-weight:900;letter-spacing:-.2px}

  /* ---------- Splash ---------- */
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:100;transition:opacity .3s}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .h{font-size:60px;animation:bounce 1s infinite}
  #splash .t{color:var(--muted);font-weight:800}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

  /* ---------- Buttons (Duolingo-3D) ---------- */
  .btn{border:none;border-radius:14px;font-family:inherit;font-weight:800;cursor:pointer;padding:13px 20px;font-size:15px;letter-spacing:.3px;transition:transform .06s,box-shadow .06s,filter .1s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
  .btn:active{transform:translateY(2px)}
  .btn-primary{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
  .btn-primary:active{box-shadow:0 2px 0 var(--green-d)}
  .btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
  .btn-blue:active{box-shadow:0 2px 0 var(--blue-d)}
  .btn-gold{background:var(--gold);color:#fff;box-shadow:0 4px 0 var(--gold-d)}
  .btn-danger{background:var(--red);color:#fff;box-shadow:0 4px 0 #c4302b}
  .btn-ghost{background:#fff;color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
  .btn-ghost:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5;cursor:default;transform:none!important}
  .btn-sm{padding:8px 14px;font-size:13.5px;border-radius:11px}
  .btn-lg{padding:16px 26px;font-size:17px;width:100%}

  /* ---------- Inputs ---------- */
  .field{margin:0 0 14px}
  .field label{display:block;font-weight:800;font-size:13px;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.5px}
  .input{width:100%;border:2px solid var(--line);background:#fbfdff;border-radius:13px;padding:13px 15px;font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);transition:.12s}
  .input:focus{outline:none;border-color:var(--blue);background:#fff}
  textarea.input{resize:vertical;min-height:90px;font-weight:600}

  /* ---------- Auth ---------- */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 20px 44px;
    background:radial-gradient(1200px 500px at 50% -10%, #eaf7ff, transparent), var(--bg)}
  .auth-card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);width:100%;max-width:490px;padding:30px 30px 26px;animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
  @keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .auth-card .mascot{font-size:58px;text-align:center;line-height:1}
  .auth-card h1{text-align:center;font-size:17px;margin:8px 0 2px;white-space:nowrap}
  .auth-card .sub{text-align:center;color:var(--muted);font-weight:700;margin:0 0 20px;font-size:14.5px}
  .tabs{display:flex;background:var(--line2);border-radius:14px;padding:5px;margin:0 0 22px;gap:4px}
  .tabs button{flex:1;border:none;background:transparent;font-family:inherit;font-weight:800;font-size:14.5px;color:var(--muted);padding:10px;border-radius:10px;cursor:pointer}
  .tabs button.active{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
  .role-opt{border:2px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;font-weight:800;transition:.12s;background:#fff}
  .role-opt .ic{font-size:26px;display:block;margin-bottom:4px}
  .role-opt.active{border-color:var(--green);background:#f3ffe9;color:var(--green-d)}
  .auth-msg{border-radius:12px;padding:10px 13px;font-weight:800;font-size:14px;margin:0 0 14px;display:none}
  .auth-msg.err{display:block;background:#fff0f0;color:var(--red-d)}
  .auth-msg.ok{display:block;background:#f0fff0;color:var(--green-d)}
  .auth-foot{text-align:center;color:var(--muted);font-size:13px;margin:16px 0 0;font-weight:700}
  .auth-credit{text-align:center;color:var(--muted);font-size:12px;margin:16px 0 0;font-weight:800;border-top:1px solid var(--line2);padding-top:12px}
  .auth-credit b{color:var(--gold-d)}
  #appfoot{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:5px 10px;background:rgba(247,249,252,.93);border-top:1px solid var(--line);z-index:30;pointer-events:none}
  #appfoot b{color:inherit;font-weight:inherit}

  /* ---------- Patch-Notes (Fab unten links + Verlauf) ---------- */
  .patch-fab{position:fixed;left:16px;bottom:30px;z-index:40;background:#fff;color:var(--muted);border:none;border-radius:999px;
    box-shadow:0 6px 18px rgba(40,60,90,.18),0 0 0 1.5px var(--line) inset;padding:9px 15px 9px 13px;font-family:inherit;font-weight:800;
    font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .08s,box-shadow .14s,color .14s}
  .patch-fab:hover{color:var(--ink);transform:translateY(-2px);box-shadow:0 9px 22px rgba(40,60,90,.24),0 0 0 1.5px var(--blue) inset}
  .patch-fab:active{transform:translateY(0)}
  .patch-fab .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px #d8f0ff}
  @media (max-width:560px){ .patch-fab span.lbl{display:none} .patch-fab{padding:11px;left:12px;bottom:36px} }
  .patchlog{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .patchlog .pn{border-left:3px solid var(--line);padding:8px 0 8px 15px}
  .patchlog .pn.latest{border-left-color:var(--green)}
  .patchlog .pn h4{margin:0;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .patchlog .pn .ver{font-size:11px;font-weight:900;color:var(--muted);background:var(--line2);padding:2px 8px;border-radius:7px;letter-spacing:.4px}
  .patchlog .pn .date{font-size:12px;color:var(--muted);font-weight:700;margin-left:auto}
  .patchlog .pn ul{margin:8px 0 2px;padding-left:19px}
  .patchlog .pn li{margin:0 0 5px;font-weight:600;line-height:1.45}
  .patchlog .pn li b{font-weight:800;color:var(--ink)}

  /* ---------- App shell ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:11px 18px;box-shadow:0 2px 10px rgba(40,60,90,.04)}
  .topbar .brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:16px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .brand .h{font-size:24px}
  .topbar .spacer{margin-left:auto}
  .chip{display:inline-flex;align-items:center;gap:7px;background:var(--line2);border-radius:999px;padding:6px 12px 6px 7px;font-weight:800;font-size:13.5px}
  .chip .av{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900}
  .chip.teacher .av{background:var(--blue)}
  .badge{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:8px;background:var(--green-l);color:var(--green-d)}
  .badge.blue{background:#dff2ff;color:var(--blue-d)}
  .badge.gold{background:#fff0d6;color:var(--gold-d)}
  .badge.gray{background:var(--line2);color:var(--muted)}

  /* ---------- Konto-Dropdown (Topbar) ---------- */
  .usermenu{position:relative;display:inline-block}
  .chipbtn{border:none;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);transition:filter .1s}
  .chipbtn:hover{filter:brightness(.97)}
  .chip .caret{font-size:11px;opacity:.65;margin-left:1px}
  .menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border-radius:14px;
    box-shadow:0 12px 30px rgba(40,60,90,.18),0 0 0 1px var(--line) inset;padding:6px;min-width:210px;z-index:60;
    display:flex;flex-direction:column;gap:2px;animation:pop .14s cubic-bezier(.2,1.2,.4,1)}
  .menu-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;
    font-family:inherit;font-weight:800;font-size:14px;color:var(--ink);padding:11px 13px;border-radius:10px;cursor:pointer}
  .menu-item:hover{background:var(--line2)}
  .menu-item.danger{color:var(--red-d)}
  .menu-item.danger:hover{background:#fff0f0}

  .container{max-width:1080px;margin:0 auto;padding:22px 18px 60px}
  .page-head{display:flex;align-items:center;gap:12px;margin:4px 0 20px;flex-wrap:wrap}
  .page-head h2{font-size:24px;margin:0}
  .page-head .spacer{margin-left:auto}
  .muted{color:var(--muted)}
  .crumb{background:none;border:none;color:var(--blue);font-weight:800;cursor:pointer;font-family:inherit;font-size:14px;padding:0}

  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .card.click{cursor:pointer;transition:transform .1s,box-shadow .1s;border:2px solid transparent}
  .card.click:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(40,60,90,.14);border-color:var(--green-l)}
  .card h3{margin:0 0 6px;font-size:18px}
  .card .meta{color:var(--muted);font-size:13.5px;font-weight:700}
  .codechip{display:inline-flex;align-items:center;gap:8px;font-family:"JetBrains Mono",monospace;font-weight:800;background:#fff7e9;color:var(--gold-d);border:2px dashed var(--gold);border-radius:11px;padding:7px 12px;font-size:16px;letter-spacing:1px}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-weight:700}
  .empty .ic{font-size:46px;display:block;margin-bottom:10px;opacity:.7}

  .list{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 15px}
  .row .grow{flex:1;min-width:0}
  .row .grow .t{display:block;font-weight:800}
  .row .grow .t.clickable{cursor:pointer;display:inline-block}
  .row .grow .t.clickable:hover{color:var(--blue);text-decoration:underline}
  .row .grow .s{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-top:2px}
  .acts{display:flex;gap:5px;flex:none}
  .abtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:14px;line-height:1;cursor:pointer;transition:.1s}
  .abtn:hover{border-color:#cdd5e0;background:#fafbfd}
  .abtn.on{background:#2b6cff;color:#fff;border-color:#2b6cff}
  .editnote{background:#fff7e6;border:1.5px solid #ffd98a;border-radius:12px;padding:9px 13px;font-size:13px;font-weight:700;color:#7a5a00;margin-bottom:10px}

  /* ---------- Matrix ---------- */
  .matrix-wrap{overflow:auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:6px}
  table.matrix{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
  table.matrix th,table.matrix td{padding:10px 12px;text-align:center;white-space:nowrap}
  table.matrix thead th{position:sticky;top:0;background:#fff;font-weight:900;color:var(--muted);border-bottom:2px solid var(--line);font-size:12.5px}
  table.matrix th.stu{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
  table.matrix td.stu{text-align:left;position:sticky;left:0;background:#fff;font-weight:800;z-index:1;border-right:2px solid var(--line)}
  table.matrix td.stu.clickable{cursor:pointer}
  table.matrix td.stu.clickable:hover{color:var(--blue);text-decoration:underline}
  table.matrix tbody tr:nth-child(even) td{background:#fafcff}
  table.matrix tbody tr:nth-child(even) td.stu{background:#fafcff}
  .cell{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;font-size:17px;font-weight:900}
  .cell.done{background:#e9ffd6;color:var(--green-d)}
  .cell.pass{background:var(--green);color:#fff}
  .cell.none{background:var(--line2);color:#c4cdd9}

  /* ---------- Modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(30,42,60,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;animation:fade .15s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:#fff;border-radius:22px;box-shadow:var(--shadow);width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:24px;animation:pop .25s cubic-bezier(.2,1.2,.4,1)}
  .modal.wide{max-width:920px}
  .modal h3{margin:0 0 4px;font-size:21px}
  .modal .x{float:right;border:none;background:var(--line2);width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer;font-weight:900;color:var(--muted)}

  /* ---------- Toast ---------- */
  #toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(24px);background:#2b3a4f;color:#fff;padding:13px 20px;border-radius:14px;font-weight:800;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none;z-index:120;max-width:90vw}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--red-d)} #toast.ok{background:var(--green-d)}

  .spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
  @keyframes rot{to{transform:rotate(360deg)}}
  .center-load{display:flex;align-items:center;justify-content:center;gap:12px;padding:50px;color:var(--muted);font-weight:800}

  @media (max-width:560px){
    .auth-card{padding:24px 20px}
    .role-pick{grid-template-columns:1fr 1fr}
  }

  /* ---------- Tool-Launcher ---------- */
  .toolgrid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));max-width:760px;margin:0 auto}
  .card.tool{text-align:center;padding:24px 16px}
  .card.tool .ticon{font-size:46px;line-height:1;margin-bottom:6px}
  .card.tool.disabled{opacity:.55;filter:grayscale(.6);cursor:not-allowed}

  /* ---------- Dark Mode (hell/dunkel/automatisch) ---------- */
  :root[data-theme="dark"]{
    --ink:#e7edf5; --muted:#9aa7b8; --line:#2b3442; --line2:#222b37;
    --bg:#141a22; --card:#1e2531; --green-l:#26361b;
    --shadow:0 8px 26px rgba(0,0,0,.55);
  }
  :root[data-theme="dark"] body{background:var(--bg)}
  :root[data-theme="dark"] .topbar{background:var(--card)}
  :root[data-theme="dark"] .menu{background:var(--card)}
  :root[data-theme="dark"] .menu-item.danger:hover{background:#3a1f22}
  :root[data-theme="dark"] .input{background:#161d27;color:var(--ink);border-color:var(--line)}
  :root[data-theme="dark"] .input:focus{background:#1e2531}
  :root[data-theme="dark"] .btn-ghost{background:#1e2531;color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
  :root[data-theme="dark"] .tabs button.active{background:#2b3442;color:var(--ink)}
  :root[data-theme="dark"] .role-opt{background:#1e2531}
  :root[data-theme="dark"] .codechip{background:#2a2410;color:var(--gold)}
  :root[data-theme="dark"] .modal{background:var(--card)}
  :root[data-theme="dark"] .matrix-wrap{background:var(--card)}
  :root[data-theme="dark"] table.matrix thead th,
  :root[data-theme="dark"] table.matrix th.stu,
  :root[data-theme="dark"] table.matrix td.stu{background:var(--card)}
  :root[data-theme="dark"] table.matrix tbody tr:nth-child(even) td,
  :root[data-theme="dark"] table.matrix tbody tr:nth-child(even) td.stu{background:#18202b}
  :root[data-theme="dark"] .row{background:var(--card)}
  :root[data-theme="dark"] .abtn:not(.on){background:#1e2531;color:var(--ink)}
  :root[data-theme="dark"] .abtn:not(.on):hover{background:#27303d}
  :root[data-theme="dark"] .patch-fab{background:var(--card);color:var(--ink)}
  :root[data-theme="dark"] #appfoot{background:rgba(20,26,34,.93)}
  :root[data-theme="dark"] .auth-wrap{background:radial-gradient(1200px 500px at 50% -10%, #102438, transparent), var(--bg)}
</style>
<script>(function(){try{var p=localStorage.getItem('themePref')||'auto';var d=p==='dark'||(p==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();</script>
</head>
<body>
  <div id="splash"><div class="h">🐹</div><div class="t">Informatik am Gymnasium Wesermünde lädt…</div></div>
  <div id="app"></div>
  <footer id="appfoot"></footer>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="engine.js?v=h14"></script>
  <script src="sqlengine.js?v=h23"></script>
  <script src="app.js?v=h23"></script>
</body>
</html>
